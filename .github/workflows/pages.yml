name: Publish cabin tour
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cabin-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix Reference/viewer-src
      - run: node --test Reference/viewer-src/check-open-house.mjs Reference/viewer-src/check-loading.mjs Reference/viewer-src/check-splitting.mjs Reference/viewer-src/check-split-fracture.mjs Reference/viewer-src/check-split-physics.mjs Reference/viewer-src/check-motion-floodlights.mjs Reference/viewer-src/check-local-conditions.mjs Reference/viewer-src/check-groundwater.mjs
      - run: node Reference/viewer-src/check-geometry.mjs "Reindeer Trail.glb"
      - run: node Reference/viewer-src/check-wildlife.mjs "Reindeer Trail.glb"
      - run: mkdir -p public
      - run: node Reference/viewer-src/build.mjs "Reindeer Trail.glb" public/index.html Reference --web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
