<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff3f0"><title>The Reindeer Trail · Property model</title>
<style>

.dock{bottom:10px}.hint{display:none}}

#views{position:absolute;right:clamp(18px,4.5vw,70px);top:clamp(18px,4.5vw,58px)}
#views button[aria-pressed=true]{background:#305749;color:white}

.inside header,.inside #hint{color:white;text-shadow:0 1px 4px #000}

@media(pointer:coarse),(max-width:700px){#stick:not([hidden]){display:block}}
@media(pointer:coarse){#lock{display:none}}
@media(max-height:470px) and (pointer:coarse){#stick{bottom:16px;width:80px;height:80px}}
@media(max-width:415px){#views button{min-width:33px;padding:6px 8px}}

@media(max-width:2220px){#views button[data-view]{display:none}.view-picker{display:flex}#views{border-radius:20px}}
@media (max-width:790px) and (min-height:471px){#views{top:94px;left:clamp(18px,4.5vw,70px)}}

#views{z-index:4;max-width:calc(100vw - 32px)}
#scene-toggle{color:#244734;background:#eef3ed}

#scene-panel{position:absolute;top:calc(100% + 8px);right:0;width:min(292px,calc(100vw - 36px));box-sizing:border-box;
  padding:16px 18px 9px;border:1px solid #bdc9c0;border-radius:17px;background:#fdfefd;color:#203d30;
  box-shadow:0 8px 28px #152a2338;font-size:.9rem;text-align:left;max-height:calc(100dvh - 130px);overflow:auto;overscroll-behavior:contain}

.scene-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #e2e9e2;min-height:46px}
#scene-panel :is(select,button){font:inherit;font-weight:600;font-size:.84rem;min-height:33px;background:#edf3ed;color:#254932;border:0;border-radius:10px;padding:5px 10px;cursor:pointer}
